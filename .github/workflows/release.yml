name: Release

# 手动触发的唯一发版入口：填一个版本号，工作流会
#   1. 把版本号写进所有可发布物（scripts/version.mjs）；
#   2. 以 OIDC 身份向 octo-sts（https://octo-sts.dev）换取本仓库 contents:write
#      的短期 token，经 GraphQL createCommitOnBranch 把变更提交到触发分支——
#      API 创建的提交由 GitHub 服务端签名（Verified 徽章）——再打上 v<版本> 附注 tag；
#   3. 用该版本号构建 backend / frontend 镜像并推送到 ghcr.io 与 Docker Hub；
#   4. 发布各语言 SDK 与 GitHub Release。

# 这是仓库里唯一会构建并推送 Docker 镜像的工作流——push 到 main 不再自动打包。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号，例如 1.2.3 或 1.3.0-rc.1（可带前导 v）；对应 tag 已存在时仅重新构建发布"
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: read # 推送走 octo-sts 换来的 token，GITHUB_TOKEN 只读
      id-token: write # octo-sts 换 token 依赖 OIDC
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      published_at: ${{ steps.mode.outputs.published_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Apply version to files
        id: version
        run: node scripts/version.mjs apply "${{ inputs.version }}"

      # 纯 JS 的 global 版本是从 verhub-sdk.js 生成的，版本号改了要一并重生成。
      - name: Rebuild vanilla-js global bundle
        run: node sdk/vanilla-js/build.mjs

      - name: Determine release mode
        id: mode
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在，本次仅重新构建发布"
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag $TAG 不存在，本次为新发版"
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
          echo "published_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # 以 OIDC 身份向 octo-sts 换取本仓库 contents:write 的短期 token，
      # job 结束时由该 action 的 post 步骤吊销
      - name: Federate token via octo-sts
        if: steps.mode.outputs.rebuild != 'true'
        id: sts
        uses: octo-sts/action@main
        with:
          scope: ${{ github.repository }}
          identity: tag-release

      - name: Create verified commit and tag
        if: steps.mode.outputs.rebuild != 'true'
        env:
          STS_TOKEN: ${{ steps.sts.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # 版本号真源与所有跟随文件，与 scripts/version.mjs 的目标清单保持一致
          files=(
            package.json
            packages/backend/package.json
            packages/ui/package.json
            web/package.json
            doc/package.json
            sdk/typescript/package.json
            sdk/typescript/src/version.ts
            sdk/vanilla-js/package.json
            sdk/vanilla-js/verhub-sdk.js
            sdk/vanilla-js/verhub-sdk.global.js
            sdk/python/verhub_sdk/_version.py
            sdk/rust/Cargo.toml
            sdk/rust/src/lib.rs
          )

          # base64 后总量已超过单个命令行参数 128KB 的上限，additions 必须走
          # 文件而非 argv 传给 jq
          additions_file="$RUNNER_TEMP/additions.json"
          b64_file="$RUNNER_TEMP/content.b64"
          printf '[]' > "$additions_file"
          for f in "${files[@]}"; do
            base64 -w0 "$f" > "$b64_file"
            jq --arg path "$f" --rawfile contents "$b64_file" \
              '. + [{path: $path, contents: ($contents | rtrimstr("\n"))}]' \
              "$additions_file" > "$additions_file.tmp"
            mv "$additions_file.tmp" "$additions_file"
          done

          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$GITHUB_SHA" \
            --arg headline "chore(release): $TAG" \
            --slurpfile additions "$additions_file" \
            '{query: $query, variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: $headline},
                fileChanges: {additions: $additions[0]}}}}' > "$RUNNER_TEMP/commit-body.json"

          resp=$(curl -sS -H "Authorization: Bearer $STS_TOKEN" \
            -d @"$RUNNER_TEMP/commit-body.json" https://api.github.com/graphql)
          commit_oid=$(jq -r '.data.createCommitOnBranch.commit.oid // empty' <<<"$resp")
          if [ -z "$commit_oid" ]; then
            echo "::error::创建提交失败：$(jq -r '.errors[0].message // .message // "未知错误"' <<<"$resp")"
            exit 1
          fi
          echo "版本号已提交至 $GITHUB_REF_NAME：$commit_oid"

          # 带 message 的附注 tag
          tag_sha=$(curl -sS -H "Authorization: Bearer $STS_TOKEN" \
            -d "$(jq -n --arg tag "$TAG" --arg oid "$commit_oid" \
              '{tag: $tag, message: "verhub \($tag)", object: $oid, type: "commit"}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/tags" | jq -r '.sha // empty')
          if [ -z "$tag_sha" ]; then
            echo "::error::创建 tag 对象失败（Octo STS 是否已放行 tag 规则？）"
            exit 1
          fi

          curl -sS --fail-with-body -H "Authorization: Bearer $STS_TOKEN" \
            -d "$(jq -n --arg tag "$TAG" --arg sha "$tag_sha" \
              '{ref: "refs/tags/\($tag)", sha: $sha}')" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" >/dev/null
          echo "tag $TAG 已创建"

  # 构建并推送刚刚打好的 tag 对应的镜像
  docker:
    needs: bump
    environment:
      name: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_suffix: "-backend"
            dockerfile: docker/backend.Dockerfile
            description: backend
          - image_suffix: "-frontend"
            dockerfile: docker/frontend.Dockerfile
            description: frontend

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 兜底：确认 tag 上的代码版本号与 tag 本身一致
      - name: Verify version matches tag
        run: node scripts/version.mjs check "${{ needs.bump.outputs.tag }}"

      - name: Prepare image names
        id: image
        run: echo "repo_lc=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.image.outputs.repo_lc }}${{ matrix.image_suffix }}
            docker.io/ivanhanloth/verhub${{ matrix.image_suffix }}
          # 预发布版本不占用 latest
          tags: |
            type=raw,value=${{ needs.bump.outputs.tag }}
            type=raw,value=${{ needs.bump.outputs.version }}
            type=raw,value=latest,enable=${{ needs.bump.outputs.is_prerelease == 'false' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关于页面显示的版本号来自这两个 build arg 写出的 build-info.json
          build-args: |
            VERHUB_BUILD_VERSION=${{ needs.bump.outputs.version }}
            VERHUB_BUILD_PUBLISHED_AT=${{ needs.bump.outputs.published_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- 各语言 SDK 发布到对应包管理平台 ----
  # 三者都 checkout 刚打好的 tag，跑一遍 version check 兜底，再构建并发布。
  # 用 sdk-publish 这个 environment 收口密钥，可在仓库设置里加保护规则。

  publish-python:
    needs: bump
    runs-on: ubuntu-latest
    environment: sdk-publish
    permissions:
      contents: read
      # PyPI Trusted Publishing 走 OIDC；若改用 API Token 可删掉本行。
      id-token: write
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Verify version matches tag
        working-directory: .
        run: node scripts/version.mjs check "${{ needs.bump.outputs.tag }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
          # Trusted Publishing 下无需 password；若用 API Token，取消下一行注释：
          # password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    needs: bump
    runs-on: ubuntu-latest
    environment: sdk-publish
    permissions:
      contents: read
      # npm 发布带 provenance 需要 OIDC。
      id-token: write
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify version matches tag
        working-directory: .
        run: node scripts/version.mjs check "${{ needs.bump.outputs.tag }}"

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Publish to npm
        run: npm publish

  publish-rust:
    needs: bump
    runs-on: ubuntu-latest
    environment: sdk-publish
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag }}

      - name: Verify version matches tag
        working-directory: .
        run: node scripts/version.mjs check "${{ needs.bump.outputs.tag }}"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs: [bump, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag }}
          PRERELEASE: ${{ needs.bump.outputs.is_prerelease }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            $([ "$PRERELEASE" = "true" ] && echo --prerelease)
