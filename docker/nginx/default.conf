# 套 CDN 时 $remote_addr 是边缘节点地址，不能拿它盖掉上游已给出的真实客户端
# 地址；只有直接对外（无 CDN）时才由本机填。X-Forwarded-For 用 $proxy_add_x_
# forwarded_for 追加而非覆盖，后端按可信层数从右往左定位访客。
map $http_x_real_ip $verhub_real_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
}

# 去掉查询串的原始请求路径（保留百分号编码），供分发直链转发给后端。
map $request_uri $verhub_request_path {
    ~^(?<path>[^?]*) $path;
}

# $verhub_serve_app / $verhub_serve_dist 与分发缓存 verhub_dist 由容器启动时
# 生成的 http.d/00-verhub-dist.conf 定义，见 docker/nginx/render-dist-conf.sh。

upstream frontend_node {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream backend_api {
    server backend:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/verhub-locations.conf;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/verhub-locations.conf;
}
