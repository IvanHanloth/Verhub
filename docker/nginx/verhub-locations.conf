# HTTP 与 HTTPS 两个 server 共用的 location。

location /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
}

# 文件分发直链 /f/{projectKey}/{fileId}/{filename}。
# 配置了分发域名时只在该域名上提供；按 4MB 分片缓存后端响应，本机存储的文件
# 由后端以 X-Verhub-Cache 标记跳过缓存。查询串不参与缓存键，也不转发给后端。
location /f/ {
    if ($verhub_serve_dist = 0) {
        return 404;
    }

    slice 4m;
    proxy_cache verhub_dist;
    proxy_cache_key "$verhub_request_path|$slice_range";
    proxy_cache_valid 200 206 10m;
    proxy_cache_revalidate on;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 60s;
    proxy_cache_use_stale error timeout updating;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_no_cache $upstream_http_x_verhub_cache;
    proxy_hide_header X-Verhub-Cache;
    add_header X-Verhub-Cache-Status $upstream_cache_status always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header Range $slice_range;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $verhub_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_pass http://backend_api/api/v1/dist$verhub_request_path;
}

# 分发接口只经上面的 /f/ 访问。
location /api/v1/dist/ {
    return 404;
}

# 文件分片上传：单个分片 8MB，不缓冲请求体；合并大文件需要较长时间。
location ~ ^/api/v1/admin/projects/[^/]+/files/uploads/ {
    if ($verhub_serve_app = 0) {
        return 404;
    }

    client_max_body_size 16m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $verhub_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_pass http://backend_api;
}

location /api/ {
    if ($verhub_serve_app = 0) {
        return 404;
    }

    # 留在后端 body 上限（1mb）之上：公告正文与更新说明不限长度，超限该由
    # 后端给出可读的错误，而不是在网关这里换回一个没头没尾的 413。
    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $verhub_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_pass http://backend_api;
}

location / {
    if ($verhub_serve_app = 0) {
        return 404;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $verhub_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
    proxy_pass http://frontend_node;
}
